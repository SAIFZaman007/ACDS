# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]        # blocks accidentally committed recordings
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/aircanvas/
        additional_dependencies: ["numpy>=1.24", "types-PyYAML"]

  - repo: local
    hooks:
      - id: no-session-recordings
        name: block committing recorded sessions
        entry: "Recorded sessions contain video of the user and must not be committed."
        language: fail
        files: '^sessions/|\.(mp4|avi|mkv)$'