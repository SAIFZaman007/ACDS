# AirCanvas configuration.


camera:
  source: 0            # camera index, or a path to a video file
  width: 1280
  height: 720
  fps: 30
  backend: auto        # auto | any | v4l2 | dshow | msmf | avfoundation | gstreamer
  mirror: true         # selfie view — essential for the drawing to feel natural
  loop: false          # loop video-file input
  realtime: false      # pace video-file input to its native frame rate

tracking:
  backend: mediapipe   # mediapipe | none ('none' disables detection, for testing)
  max_hands: 1
  detection_confidence: 0.6
  tracking_confidence: 0.6
  model_complexity: 1  # 0 = ~2x faster on weak CPUs, 1 = more accurate
  preferred_hand: any  # any | left | right

gestures:
  vote_window: 5             # frames considered by the majority vote
  min_votes: 3               # matching frames needed to switch gesture
  extension_margin: 1.05     # hysteresis on finger extension; raise if flappy
  thumb_rise: 0.35           # how far above the knuckles the thumb must sit
  save_hold_seconds: 0.9     # deliberate hold before a save fires
  clear_hold_seconds: 1.6
  action_cooldown_seconds: 2.0
  dwell_seconds: 0.45        # hover time to activate a toolbar control

smoothing:
  enabled: true
  min_cutoff: 1.2      # lower  -> steadier lines when the hand is slow
  beta: 0.02           # higher -> less lag when the hand moves fast
  d_cutoff: 1.0

drawing:
  # BGR triples (OpenCV order), rendered left to right in the toolbar.
  colors:
    - [80, 80, 245]      # red
    - [80, 200, 255]     # amber
    - [90, 220, 120]     # green
    - [235, 180, 70]     # blue
    - [220, 120, 220]    # violet
    - [250, 250, 250]    # white
  thickness_steps: [4, 10, 20]
  default_color_index: 0
  default_size_index: 1
  eraser_radius: 48
  max_history: 128     # strokes kept undoable; older ones bake into the base layer
  antialias: true

ui:
  toolbar_height: 76
  show_landmarks: true
  show_help: true
  window_title: AirCanvas

recording:
  enabled: true
  layout: overlay      # overlay | side_by_side | pip | canvas_only
  fps: 30              # must match your real throughput or playback speed drifts
  codec: mp4v          # mp4v | avc1 | XVID | MJPG (falls back automatically)
  queue_size: 64
  max_seconds: 1800    # hard cap; protects against runaway disk usage
  filename: session-video

output:
  root: ./sessions
  session_name: null   # null -> session-YYYYMMDD-HHMMSS (UTC)
  export_vectors: true # write replayable stroke JSON alongside the PNGs
  paper_color: [255, 255, 255]

logging:
  level: INFO          # DEBUG | INFO | WARNING | ERROR | CRITICAL
  json: false          # true -> line-delimited JSON for log aggregators
  to_file: true        # rotating session.log inside the session directory

headless: false        # true -> no preview window (servers, CI, batch runs)
duration: null         # seconds; null -> run until quit



