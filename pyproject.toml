[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "aircanvas"
version = "1.0.0"
description = "Touchless air-drawing studio powered by real-time hand tracking."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
keywords = ["computer-vision", "mediapipe", "opencv", "gesture-recognition", "hci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.24,<3"
opencv-python = ">=4.8,<5"
mediapipe = "0.10.21"
PyYAML = ">=6.0,<7"
opencv-python-headless = { version = ">=4.8,<5", optional = true }

[tool.poetry.extras]
headless = ["opencv-python-headless"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.11"
types-PyYAML = "*"
pip-audit = ">=2.7"
pre-commit = ">=3.7"

[tool.poetry.scripts]
aircanvas = "src.cli:main"

[tool.poetry.urls]
Documentation = "https://github.com/your-org/aircanvas#readme"
Source = "https://github.com/your-org/aircanvas"

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "ARG",       # unused arguments
    "PTH",       # prefer pathlib
    "RUF",       # ruff-specific
    "S",         # bandit security rules
]
ignore = [
    "S101",   # asserts are fine in tests and internal invariants
    "B008",   # function call in default argument (argparse patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "S311"]

# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cv2.*", "mediapipe.*", "yaml.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning:google.*"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]